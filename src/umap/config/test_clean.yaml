umap_node:
  # Processing parameters
  threshold_point: 0.10 # 0.035 # 0.05
  threshold_line: 2.0 # 3.0good
  min_length_line: 20
  row_downsample: 1 # useless param
 
  # Depth parameters
  max_dist: 7000.0 # 及时修改 否则会导致直方图全为0(出现在分母)
  min_dist: 0.0
  hist_size: 150
  depth_factor: 1000.0 # Real depth = value / depth_factor
  inverse_depth: false

  # Camera parameters
  camera_frame: "d400_color_optical_frame"
  camera:
    fx: 525.0
    fy: 525.0
    cx: 319.5
    cy: 239.5
  
tracker_node:
  # params for matching
  DYNAMIC_IOU_THRESHOLD: 0.1 #0为不筛选
  DYNAMIC_DIST_THRESHOLD: 0.5
  iou_weight: 0.7
  dist_weight: 0.3

  UNMATCHED_PUBLISH_TIMEOUT: 0.5 # seconds, how long to keep publishing unmatched dynamic trackers
  MAX_TRACKER_AGE: 10.0 # seconds, max age of a tracker without updates
  # params for determination of dynamic obstacles
  DYNAMIC_VELOCITY_THRESHOLD: 0.0
  DYNAMIC_VELOCITY_MAX: 100.0

  SUSTAINED_VELOCITY_THRESHOLD: 0.2
  SUSTAINED_VELOCITY_COUNT: 5

  AVERAGE_DEPLACEMENT_THRESHOLD: 0.2
  HISTORY_SIZE: 10 # History size for pos & vel
  # params for isDynamic
  STATUS_HISTORY_SIZE: 10
  MIN_CONSECUTIVE_FRAMES_FOR_STATUS_CHANGE: 3

  # Visualization frame id
  COARSE_VIS_FRAME: "d400_color_optical_frame"

rematch_node:
  SIMILARITY_THRESHOLD: 0.72
  SIMILARITY_WEIGHT: 0.8

  IOU_THRESHOLD: 0.2
  IOU_WEIGHT: 0.5
  
  VELOCITY_DIFF_THRESHOLD: 0.5
  VELOCITY_DIFF_WEIGHT: 0.5
  MAX_TRACKER_AGE : 0.0 # seconds, max age of a tracker without updates
  REMATCH_VIS_FRAME: "d400_color_optical_frame"