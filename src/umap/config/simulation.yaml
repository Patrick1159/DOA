umap_node:
  # Processing parameters
  threshold_point: 0.03 # 0.035 # 0.05
  threshold_line: 2.0 # 3.0good
  min_length_line: 30
  row_downsample: 1 # useless param
 
  # Depth parameters
  max_dist: 6.0 # 及时修改 否则会导致直方图全为0(出现在分母)
  min_dist: 0.0
  hist_size: 150
  depth_factor: 1.0 # Real depth = value / depth_factor
  inverse_depth: false

  # Camera parameters
  camera_frame: "d435_color_optical_frame"
  camera:
    fx: 554.3827128226441
    fy: 554.3827128226441
    cx: 320.5
    cy: 240.5
  
tracker_node:
  # params for matching
  DYNAMIC_IOU_THRESHOLD: 0.1 #0为不筛选
  DYNAMIC_DIST_THRESHOLD: 5.0
  iou_weight: 0.7
  dist_weight: 0.3

  UNMATCHED_PUBLISH_TIMEOUT: 0.5 # seconds, how long to keep publishing unmatched dynamic trackers
  MAX_TRACKER_AGE: 10.0 # seconds, max age of a tracker without updates
  # params for determination of dynamic obstacles
  DYNAMIC_VELOCITY_THRESHOLD: 0.0
  DYNAMIC_VELOCITY_MAX: 100.0

  SUSTAINED_VELOCITY_THRESHOLD: 0.3
  SUSTAINED_VELOCITY_COUNT: 3

  AVERAGE_DEPLACEMENT_THRESHOLD: 0.15
  HISTORY_SIZE: 10 # History size for pos & vel
  # params for isDynamic
  STATUS_HISTORY_SIZE: 10
  MIN_CONSECUTIVE_FRAMES_FOR_STATUS_CHANGE: 3

  # Ground filter: reject detections whose centroid in the output frame
  # has z below this value. Output frame is `odom` (z=0 is ground), so
  # 0.1 means "must be at least 10 cm above floor to count as obstacle".
  MIN_OBSTACLE_Z: 0.1

  # Visualization frame id (also the frame KF state lives in after Phase 7
  # frame-honest refactor — robot motion does not appear as obstacle motion).
  COARSE_VIS_FRAME: "odom"
  # Output frame id (frame_id stamped on obstacles_msg consumed downstream).
  # Must equal the frame KF state lives in.
  COARSE_OUTPUT_FRAME: "odom"

rematch_node:
  SIMILARITY_THRESHOLD: 0.45  # lowered from 0.71 to reduce FN from CLIP feature mismatches
  SIMILARITY_WEIGHT: 0.6      # lowered from 0.8 to reduce feature dominance over geometry

  IOU_THRESHOLD: -0.1
  IOU_WEIGHT: 0.5

  DISTANCE_THRESHOLD: 1.0     # ADDED — was using C++ default 0.1m, which rejected
                               # virtually every tracker-detection pair >10 cm apart.
                               # 1.0 m is a reasonable gate for moving obstacles at 15 Hz.
  DISTANCE_WEIGHT: 0.5         # ADDED — explicit (matches C++ default)

  VELOCITY_DIFF_THRESHOLD: 0.5   # NOTE: these params are not consumed by the current
  VELOCITY_DIFF_WEIGHT: 0.5      # C++ rematch code; DISTANCE_THRESHOLD/WEIGHT replaced them.
  MAX_TRACKER_AGE : 1.0 # seconds, max age of a tracker without updates
  REMATCH_VIS_FRAME: "odom"
  # Output frame id (frame_id stamped on tracker_details consumed downstream).
  # Must equal the frame KF state lives in.
  REMATCH_OUTPUT_FRAME: "odom"