local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 10.0
  publish_frequency: 5.0
  static_map: false
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.05

  plugins:
   # - {name: obstacle_layer,      type: "costmap_2d::ObstacleLayer"} # Optional: Standard obstacle layer
   - {name: dynamic_obstacle_layer, type: "path_planning::DynamicObstacleLayer"}
   - {name: inflation_layer,     type: "costmap_2d::InflationLayer"}

  dynamic_obstacle_layer:
    enabled: true
    decay_rate: 2.0           # Cost decay rate (1/s)
    keep_alive_time: 0.2      # Time to keep cost before decaying (s)
    velocity_factor: 0.5      # Factor for velocity-based prediction
    max_prediction_time: 1.5  # Max prediction horizon (s)
    obstacle_radius_buffer: 0.05 # Extra buffer for obstacle radius (m)
