local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05

  plugins:
   - {name: obstacle_layer,      type: "costmap_2d::ObstacleLayer"}
   - {name: dynamic_obstacle_layer, type: "path_planning::DynamicObstacleLayer"}
   - {name: inflation_layer,     type: "costmap_2d::InflationLayer"}

  dynamic_obstacle_layer:
    enabled: true
    decay_time_constant: 5.0
    velocity_scale: 1.0
    obstacle_timeout: 2.0
